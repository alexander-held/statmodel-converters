name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *" # after the nightly ROOT wheels are published

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: prefix-dev/setup-pixi@v0.11.3
      - name: ROOT version
        run: pixi run python -c "import ROOT; print(ROOT.gROOT.GetVersion(), ROOT.gROOT.GetGitCommit(), ROOT.gROOT.GetGitDate())"
      - name: Test
        run: pixi run test
